<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><link rel="icon" href="/assets/logos/mark.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LED</title>
<link rel="stylesheet" href="/assets/common.css">
<style>
  @font-face{font-family:'Anton';src:url(/assets/fonts/Anton-Regular.ttf) format('truetype');font-display:block}
  @font-face{font-family:'Black Han Sans';src:url(/assets/fonts/BlackHanSans-Regular.ttf) format('truetype');font-display:block}
  /* ===== LED theme v1: poster look (sky, kraft paper, fire, red type) ===== */
  :root{
    --sky1:#BFE1F7; --sky2:#E6F3FC; --cream:#FBF4E8; --paper:#FFFDF8; --kraft:#DCC093; --kraft2:#C9A26B;
    --ink:#23140D; --muted:#6E5748; --faint:#A48F80; --line:rgba(35,20,13,.14);
    --red:#B3231B; --red2:#8E1812; --fire:#FF6A1A; --flame:#FFC23D; --pink:#F2789A; --gold:#E08A00; --ok:#1F8A4C;
    --disp:'Anton','Pretendard Variable',sans-serif; --kdisp:'Black Han Sans','Pretendard Variable',sans-serif;
  }
  html,body{height:100%;overflow:hidden}
  body{color:var(--ink);background:#EAF5FC;margin:0;display:flex;align-items:center;justify-content:center}
  /* fixed 16:9 stage: every size is relative to it (cq units), so any window shape letterboxes instead of breaking */
  #stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));container-type:size;overflow:hidden;display:grid;grid-template-rows:9cqh 1fr 13cqh;grid-template-columns:minmax(0,1fr)}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:40;opacity:.12;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .22  0 0 0 0 .12  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .disp{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.01em;line-height:.92}
  .kd{font-family:var(--kdisp);font-weight:400;letter-spacing:-.01em;line-height:1.08}
  .red{color:var(--red)} .fire{color:var(--fire)}
  .num{font-variant-numeric:tabular-nums}
  /* ---------- frame ---------- */
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:0 3cqw;position:relative;z-index:5}
  .brand{display:flex;align-items:baseline;gap:1.4cqw}
  .brand .title{font-family:var(--disp);font-size:4.4cqh;color:var(--red);letter-spacing:.02em;text-transform:uppercase}
  .brand .title b{font-weight:400;color:var(--ink)}
  .brand .sub{font-size:1.9cqh;color:var(--muted);font-weight:700;letter-spacing:.04em}
  .tag{font-weight:900;font-size:1.9cqh;letter-spacing:.2em;color:var(--red);display:flex;align-items:center;gap:.8cqw}
  .tag .dot{width:1.2cqh;height:1.2cqh;border-radius:50%;background:var(--red);animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  .hdr .right{display:flex;align-items:center;gap:1.6cqw}
  .clock{font-size:3cqh;font-weight:800;color:var(--ink)}
  .mascot{height:8cqh;margin-top:2.6cqh}
  footer{display:flex;align-items:center;justify-content:center;gap:1.8cqw;padding:0 2.4cqw;min-width:0;overflow:hidden;position:relative;z-index:5;
    background:#fff;border-top:2px solid rgba(35,20,13,.08)}
  footer .grp{display:flex;align-items:center;gap:min(2.2cqw,3.4cqh);min-width:0}
  footer img{display:block}
  footer .sep{width:2px;height:5.6cqh;background:var(--line)}
  main{position:relative;overflow:hidden;padding:2.4cqh 3cqw;z-index:2}
  .scene{position:absolute;inset:2.4cqh 3cqw;display:none}
  .scene.on{display:flex;animation:fadein .5s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(1cqh)}to{opacity:1;transform:none}}
  .kicker{font-size:2.2cqh;font-weight:900;letter-spacing:.2em;color:var(--red)}
  .muted{color:var(--muted)}
  .h1{font-family:var(--kdisp);font-size:9cqh;line-height:1.1}
  .h2{font-size:4cqh;font-weight:800;line-height:1.3}
  .p{font-size:2.8cqh;line-height:1.6;color:var(--muted);font-weight:500}
  .paper{background:#fff;border-radius:1.2cqh}
  .kraftc{background:linear-gradient(160deg,#E4CA9E,#D2AE79);border-radius:1.2cqh}
  .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,106,26,.14) 0deg 3deg,transparent 3deg 10deg);animation:spin 120s linear infinite;z-index:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* ---------- board ---------- */
  #board{gap:2.4cqw}
  #board .left{flex:0 0 31%;display:flex;flex-direction:column;justify-content:center;gap:2cqh;padding-right:2.4cqw;border-right:2px dashed rgba(179,35,27,.25)}
  .big{font-family:var(--disp);line-height:.85;font-size:34cqh;color:var(--red)}
  .big small{font-size:10cqh;color:var(--faint)}
  .cd{font-family:var(--disp);font-size:8cqh;color:var(--ink);letter-spacing:.02em}
  .stats{display:flex;gap:1.6cqw;font-size:2.1cqh;color:var(--muted);flex-wrap:wrap;font-weight:600}
  .stats b{color:var(--ink);font-size:3.2cqh;margin-right:.3cqw;font-weight:900}
  #board .right{flex:1;display:flex;flex-direction:column;gap:2cqh;min-width:0}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:1.4cqh 1.1cqw;flex:1.3;min-height:0}
  .slot{border:3px dashed rgba(179,35,27,.28);border-radius:1.4cqh;display:flex;flex-direction:column;justify-content:space-between;padding:1.6cqh 1.2cqw;min-width:0;position:relative;overflow:hidden;background:rgba(255,253,248,.55)}
  .slot .n{font-family:var(--disp);font-size:2.6cqh;color:var(--faint);letter-spacing:.06em}
  .slot .open{font-family:var(--disp);font-size:4cqh;color:rgba(179,35,27,.22);letter-spacing:.08em}
  .slot.filled{border:none;background:#fff;box-shadow:inset 0 0 0 4px var(--red)}
  .slot.filled .n{color:var(--red)}
  .slot .team{font-family:var(--kdisp);font-size:4.4cqh;color:var(--ink);line-height:1.1}
  .slot .svc{font-size:1.9cqh;color:var(--red2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot.new{animation:pop 1.2s ease}
  @keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:none}}
  .qhead{display:flex;justify-content:space-between;align-items:baseline}
  .queue{display:flex;flex-wrap:wrap;gap:1cqh .8cqw;align-content:flex-start;flex:.8;min-height:0;overflow:hidden}
  .q{display:flex;align-items:center;gap:.7cqw;border-radius:999px;padding:.8cqh 1.1cqw;font-size:2.1cqh;background:var(--paper);border:1px solid var(--line);font-weight:600}
  .q .no{color:var(--faint);font-weight:900}
  .q .nm{font-weight:800}
  .q .dots{display:flex;gap:.25cqw}
  .q .dots i{width:1cqh;height:1cqh;border-radius:50%;background:rgba(35,20,13,.15)}
  .q .dots i.on{background:var(--fire)}
  .q.reviewing{border-color:var(--fire)}
  .q.fail{opacity:.45;text-decoration:line-through}
  .q.pass{background:var(--red);color:#fff;border-color:var(--red)}
  .q.pass .no{color:rgba(255,255,255,.7)}
  .q.closed{opacity:.35}
  .ticker{position:absolute;left:0;right:0;bottom:0;height:4.6cqh;display:flex;align-items:center;overflow:hidden;font-size:2cqh;color:var(--cream);background:var(--ink);border-radius:1cqh}
  .ticker .lbl{position:relative;z-index:2;flex:none;padding:0 1.2cqw;font-weight:900;color:var(--flame);letter-spacing:.14em;height:100%;display:flex;align-items:center;background:var(--red)}
  .ticker .tw{flex:1;overflow:hidden;min-width:0}
  .ticker .track{display:inline-block;white-space:nowrap;animation:scroll 60s linear infinite;padding-left:100%}
  .ticker .track span{margin-right:3cqw}
  .ticker .track b{color:#fff}
  @keyframes scroll{to{transform:translateX(-100%)}}
  #board.withticker{bottom:7.8cqh}
  /* ---------- flash ---------- */
  .flash{position:absolute;left:0;right:0;top:9cqh;bottom:13cqh;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:4cqh 6cqw;overflow:hidden;background:var(--cream)}
  .flash.on{display:flex}
  .flash>*{position:relative;z-index:2}
  .flash .bg{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;opacity:.35}
  .flash .pre{font-size:3cqh;font-weight:900;letter-spacing:.3em;color:var(--red)}
  .flash .tname{font-family:var(--kdisp);font-size:13cqh;line-height:1.08;margin:1.6cqh 0 .8cqh;color:var(--ink);white-space:nowrap;max-width:90cqw;overflow:hidden;text-overflow:ellipsis}
  .flash .members{font-size:2.8cqh;color:var(--muted);font-weight:700}
  .flash .svc{font-size:3cqh;line-height:1.3;margin-top:1.8cqh;max-width:72cqw;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .flash .svc b{color:var(--red)}
  .flash .tally{margin-top:2.2cqh;font-family:var(--disp);font-size:5.6cqh;display:flex;gap:2cqw;justify-content:center;letter-spacing:.04em}
  .flash .comments{margin-top:2cqh;display:flex;flex-direction:column;gap:.8cqh;font-size:2.3cqh;color:var(--ink);max-width:70cqw;font-weight:600}
  .flash .comments div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flash .stamp{font-family:var(--kdisp);font-size:13cqh;line-height:1}
  .flash .stamp.rev small{display:block;font-size:4.2cqh;letter-spacing:.3em;color:#FFD27A;margin-bottom:1cqh}
  .flash.pass{background:radial-gradient(ellipse 60cqw 55cqh at 50% 48%,#FFF3D6 0%,#FFD38A 45%,#FF8A3D 100%)}
  .flash.pass .stamp{color:var(--red);animation:rise .8s cubic-bezier(.2,1.4,.4,1)}
  .flash.fail{background:var(--cream)}
  .flash.fail .stamp{color:var(--red);border:1.4cqh solid var(--red);padding:.4cqh 3cqw;border-radius:2cqh;transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.3,1.6,.5,1);mix-blend-mode:multiply}
  .flash.fail .tname{color:rgba(35,20,13,.75)}
  .flash .rem{margin-top:2.2cqh;font-size:2.8cqh;color:var(--red);font-weight:900;letter-spacing:.06em}
  @keyframes rise{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
  @keyframes stamp{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg);opacity:1}}
  .suspense .pre{animation:blink 1s infinite}
  /* ---------- other scenes ---------- */
  .center{flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .qrbox{display:flex;align-items:center;gap:1.4cqw;margin-top:2cqh}
  .qrbox img{height:13cqh;background:#fff;padding:.8cqh;border-radius:1cqh}
  .topics{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8cqh 1.4cqw;width:100%;height:100%}
  .tc{border-radius:1.4cqh;padding:2.4cqh 1.6cqw;display:flex;flex-direction:column;justify-content:space-between;background:#fff;box-shadow:inset 0 0 0 2px rgba(35,20,13,.08);perspective:800px}
  .tc .logo{height:4cqh;align-self:flex-start}
  .tc .t{font-family:var(--kdisp);font-size:3.5cqh;line-height:1.25;color:var(--ink)}
  .tc.hidden{background:var(--red);box-shadow:none}
  .tc.hidden *{visibility:hidden}
  .tc.flip{animation:flip .7s ease}
  @keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
  .tc.wild{background:#fff;box-shadow:inset 0 0 0 4px var(--red)}
  .tc .wl{font-family:var(--disp);font-size:3.4cqh;letter-spacing:.08em;color:var(--red)}
  .mswrap{display:flex;flex-direction:column;gap:1.3cqh;width:100%;height:100%}
  .cmstats.ms .n{font-size:6cqh}
  .msrows{display:flex;flex-direction:column;flex:1;min-height:0;justify-content:space-between}
  .msrow{display:grid;grid-template-columns:5cqw 11cqw 30% 1fr;align-items:center;gap:1.4cqw;padding:.5cqh 0;border-bottom:1px solid var(--line)}
  .msrow:last-child{border-bottom:0}
  .msrow .mn{font-family:var(--disp);font-size:4.6cqh;line-height:1;color:var(--fire);text-align:right}
  .msrow.none .mn{color:var(--muted)}
  .msrow .mlogo{display:flex;align-items:center}
  .msrow .wl{font-weight:900;font-size:1.8cqh;letter-spacing:.06em;color:#FF7A4D}
  .msrow .mt{font-size:2.05cqh;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .msrow .mteams{font-size:1.85cqh;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .mteams i,.mslegend i{font-style:normal;white-space:nowrap}
  .mteams i+i::before{content:'·';color:var(--muted);opacity:.6;margin:0 .55em}
  .mteams i.s-d,.mslegend i.s-d{color:var(--muted)}
  .mteams i.s-r,.mslegend i.s-r{color:#F6E6DA;font-weight:700}
  .mteams i.s-p,.mslegend i.s-p{color:#FF7A4D;font-weight:800}
  .mteams i.s-o,.mslegend i.s-o{color:var(--muted);opacity:.4;text-decoration:line-through}
  .cmstats>div.mslegend{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:1.6cqw;font-size:1.9cqh;align-self:flex-end;padding-bottom:.6cqh}
  .mslegend i::before{content:'';display:inline-block;width:1.1cqh;height:1.1cqh;border-radius:50%;background:currentColor;margin-right:.5em;vertical-align:middle;text-decoration:none}
  .subban{position:absolute;left:3cqw;right:3cqw;bottom:15cqh;z-index:40;display:flex;align-items:center;gap:2cqw;padding:2.2cqh 2.4cqw;border-radius:1.6cqh;
    background:linear-gradient(90deg,#2A140C,#1A0E0A);box-shadow:inset 0 0 0 .3cqh #FF7A4D,0 2cqh 6cqh rgba(0,0,0,.6);color:#F6E6DA;
    transform:translateY(40cqh);opacity:0;transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .4s}
  .subban.on{transform:none;opacity:1}
  .subban .k{font-weight:900;letter-spacing:.14em;font-size:2cqh;color:#FF7A4D}
  .subban b{font-family:var(--disp);font-size:6cqh;line-height:1;color:#FF7A4D}
  .subban .bcol{display:flex;flex-direction:column;gap:.9cqh;min-width:0;flex:1}
  .subban .l1{display:flex;align-items:baseline;gap:1.4cqw;min-width:0}
  .subban .tn{font-size:4.4cqh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:36cqw;flex:none}
  .subban .sv{font-size:2.6cqh;color:#C9BFB2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .subban .l2{display:flex;align-items:center;gap:.9cqw;min-width:0;font-size:2.3cqh;color:#FFB08F;font-weight:700}
  .subban .l2 .ml{font-size:1.6cqh;font-weight:900;letter-spacing:.14em;color:#FF7A4D;flex:none}
  .subban .l2 img{flex:none} .subban .l2 .mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .cmwrap{display:flex;flex-direction:column;gap:2.4cqh;width:100%;height:100%}
  .cmstats{display:flex;gap:3cqw;align-items:flex-end}
  .cmstats>div{display:flex;flex-direction:column}
  .cmstats .n{font-family:var(--disp);font-size:11cqh;line-height:1;color:var(--fire)}
  .cmstats .l{font-size:2.2cqh;color:var(--muted);margin-top:.6cqh} .cmstats .l i{font-style:normal;opacity:.7}
  .cmcols{display:flex;gap:2.4cqw;flex:1;min-height:0}
  .cmleft{flex:1.25;display:flex;flex-direction:column;gap:1.1cqh;overflow:hidden}
  .cmright{flex:1;display:flex;flex-direction:column;gap:1.4cqh;overflow:hidden;border-left:1px solid var(--line);padding-left:2cqw}
  .cmrow{display:grid;grid-template-columns:22% 1fr 7%;align-items:center;gap:1cqw;font-size:2.3cqh}
  .cmrow b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cmrow span{text-align:right;font-weight:700}
  .cmrow .cbar{height:1.8cqh;background:rgba(255,255,255,.07);border-radius:1cqh;overflow:hidden}
  .cmrow .bar{height:100%;transition:width .8s ease}
  .cmrow.hot .bar{background:#FFB08F;box-shadow:0 0 1.4cqh #FF7A4D}
  .cmright .feed div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  table.cm{width:100%;border-collapse:collapse;font-size:2.1cqh}
  table.cm td{padding:.7cqh .6cqw;border-bottom:1px solid var(--line)}
  .bar{height:1.4cqh;background:var(--fire);border-radius:1cqh}
  .feed{display:flex;flex-direction:column;gap:1cqh;font-size:2.1cqh;overflow:hidden}
  .feed div{border-left:4px solid var(--fire);padding-left:.8cqw}
  .demo-wrap{gap:3cqw;width:100%}
  .lineup{flex:0 0 26%;display:flex;flex-direction:column;gap:1cqh;border-right:2px dashed rgba(179,35,27,.25);padding-right:2cqw;justify-content:center}
  .lineup div{font-size:2.5cqh;padding:1cqh 1cqw;border-radius:1cqh;color:var(--muted);font-weight:700}
  .lineup div.cur{background:var(--red);color:#fff}
  .lineup div.done{opacity:.45}
  .lineup div{display:flex;align-items:center;gap:.8cqw}
  .lineup .lv{margin-left:auto;max-width:8cqw;object-fit:contain}
  .offer{margin-top:1.4cqh;padding:2cqh 2cqw;border-radius:1.6cqh;border:2px solid var(--fire);background:rgba(255,122,77,.08);display:flex;flex-direction:column;gap:1.4cqh}
  .offer .oq{font-size:3cqh;font-weight:800;color:var(--ink)}
  .offer .cnt{font-family:var(--disp);font-size:9cqh;line-height:1;color:var(--fire)}
  .offer .cnt small{font-family:'Pretendard Variable',sans-serif;font-size:2.6cqh;margin-left:1cqw;color:var(--muted);font-weight:700}
  .offer .hands{display:flex;gap:3cqw;align-items:center;flex-wrap:wrap}
  .offer .hands img,.offer.done img{animation:rise .6s ease}
  .offer.done{flex-direction:row;align-items:center;gap:2cqw;border-color:var(--gold);background:rgba(255,196,107,.1)}
  .offer.done .ok{font-family:var(--kdisp);font-size:5cqh;color:var(--gold)}
  .timer{font-family:var(--disp);font-size:20cqh;line-height:1;color:var(--ink)}
  .timer.warn{color:var(--gold)}.timer.over{color:var(--red)}
  /* shark tank stage: the finalist's own PDF or live demo fills the LED, a slim bar keeps team + timer in view */
  body.stagefull #stage{grid-template-rows:minmax(0,1fr) 13cqh}
  body.stagefull .hdr{display:none}
  body.stagefull main{padding:0}
  body.stagefull #demo{inset:0}
  body.stagefull::after{opacity:0}
  .stg{display:flex;flex-direction:column;width:100%;height:100%;background:#0A0706}
  .sbar{flex:0 0 8.5cqh;display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:0 2.4cqw;border-bottom:1px solid rgba(246,230,218,.12);min-width:0}
  .sbar .sl{display:flex;align-items:baseline;gap:1.4cqw;min-width:0;overflow:hidden;white-space:nowrap}
  .sbar .k{flex:0 0 auto;font-size:1.9cqh;font-weight:900;letter-spacing:.18em;color:var(--red)}
  .sbar b{flex:0 1 auto;font-family:var(--kdisp);font-size:4.2cqh;font-weight:400;color:#F6E6DA;overflow:hidden;text-overflow:ellipsis}
  .sbar .sv{flex:0 1 auto;font-size:2.4cqh;color:rgba(246,230,218,.62);font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .sbar .sr{display:flex;align-items:baseline;gap:1cqw;flex:0 0 auto}
  .sbar .ph{font-size:2.2cqh;font-weight:800;color:rgba(246,230,218,.62)}
  .sbar .tm{font-family:var(--disp);font-size:6cqh;line-height:1;color:#F6E6DA}
  .sbar .tm.warn{color:var(--gold)}.sbar .tm.over{color:var(--red)}
  .sbody{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sbody canvas{display:block;border-radius:.4cqh}
  .sbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}

  /* finale: matched teams as big cards, the rest as a quiet list, credits for all eight */

  .fin .side{flex:0 0 26%;display:flex;flex-direction:column;gap:1.4cqh;border-left:2px dashed rgba(246,230,218,.15);padding-left:2cqw;min-width:0}

  .fin .side .cr{margin-top:auto;padding:2cqh 1.4cqw;border-radius:1.4cqh;background:rgba(255,196,107,.1);border:1px solid rgba(255,196,107,.4)}

  #standby{align-items:center;justify-content:center}
  #standby .vid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .8s}
  #standby video{width:100%;height:100%;object-fit:contain;border-radius:1.4cqh}
  #standby .info{position:absolute;inset:0;display:flex;gap:4cqw;align-items:center;transition:opacity .8s}
  #standby .poster{height:64cqh;border-radius:1.6cqh;transform:rotate(-2deg);box-shadow:0 2cqh 4cqh rgba(35,20,13,.18)}
  #standby .corner{position:absolute;right:0;bottom:0;text-align:right;font-size:2.6cqh;color:var(--ink);font-weight:800;z-index:3}
  #standby .corner b{color:var(--red);font-family:var(--disp);font-size:4cqh;font-weight:400}
  .hide{opacity:0;pointer-events:none}
  /* ---------- opening slides ---------- */
  .slide{flex-direction:column;justify-content:center;width:100%;position:relative}
  .sl{width:100%}
  .kw{font-family:var(--kdisp);color:var(--red);line-height:1.05}

  .still::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(234,245,252,.94) 0%,rgba(234,245,252,.6) 45%,rgba(234,245,252,0) 78%)}
  .onstill{position:relative;z-index:2}
  .photo{border:1.2cqh solid var(--paper);border-bottom-width:4cqh;box-shadow:0 1.6cqh 3cqh rgba(35,20,13,.22);background-size:cover;background-position:center}
  .sl-nums{display:flex;align-items:flex-end;gap:2.4cqw}

  .sl-logos{display:flex;flex-direction:column;gap:2.4cqh;width:100%}

  .sl-logos .row{flex:1;display:flex;align-items:center;gap:3cqw;flex-wrap:wrap}
  .sl-judges{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqh 1.6cqw;width:100%}

  /* editorial stats */

  .dotm{display:grid;grid-template-columns:repeat(100,1fr);gap:.45cqh;width:100%}

  .ed{display:flex;flex-direction:column;width:100%}

  .ed span{margin-left:auto;font-size:2.4cqh;color:var(--muted);font-weight:600;text-align:right}
  .pg{position:absolute;inset:0;display:flex;flex-direction:column}
  .pg-t{font-family:var(--kdisp);font-weight:400;font-size:8.4cqh;line-height:1.12;color:var(--ink);margin-top:3cqh;min-height:14cqh}

  .pg-b{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:4cqh}
  .line{font-size:4.6cqh;font-weight:700;color:var(--ink);line-height:1.45}
  .line.m{color:var(--muted);font-weight:600}
  .hero{font-family:var(--disp);font-weight:400;color:var(--red);line-height:.86}
  .sl-five{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw;width:100%}
  .sl-five div{padding:2.6cqh 1.4cqw;display:flex;flex-direction:column;gap:1.2cqh}
  .sl-five b{font-family:var(--kdisp);font-weight:400;font-size:5.4cqh;color:var(--red);line-height:1.1}
  .sl-five span{font-size:2.2cqh;color:var(--ink);font-weight:600;line-height:1.5}
  .sl-five i{font-style:normal;font-family:var(--disp);font-size:3cqh;color:var(--faint)}

  /* ===== opening deck: drawn visuals, Pretendard, ivory and night ===== */
  @font-face{font-family:'PretendardV';src:url(/assets/fonts/PretendardVariable.woff2) format('woff2-variations'),url(/assets/fonts/PretendardVariable.woff2) format('woff2');font-weight:45 920;font-display:block}
  :root{--ivory:#F7F3EB; --night:#0A0403; --ink2:#17110F; --cream2:#F6E6DA; --pink2:#D97757; --pinkd:#EE9A78; --maroon:#5A1A16; --stone:#857B72; --dotc:#E6DFD3}
  body.deck #stage{grid-template-rows:1fr 13cqh}
  body.deck .hdr{display:none}
  body.deck main{padding:0}
  body.deck #slide{inset:0}
  body.deck::after{opacity:0}
  .d{position:absolute;inset:0;overflow:hidden;font-family:'PretendardV','Pretendard Variable',sans-serif;color:var(--ink2);background:var(--ivory);word-break:keep-all;animation:dIn .6s ease}

  .wm{font-weight:900;text-transform:uppercase;letter-spacing:-.012em;line-height:.94}
  .wm em{font-style:normal;color:var(--pink2)}
  .d.dark .wm{color:var(--cream2);text-shadow:0 .035em 0 var(--maroon),0 0 .5em rgba(217,119,87,.26)}
  .dh{font-weight:820;font-size:8.2cqh;letter-spacing:-.035em;line-height:1.2}

  .d.dark .dh em,.d.dark .ds em{color:var(--pinkd)}
  .ds{font-weight:500;font-size:3.6cqh;line-height:1.45;letter-spacing:-.012em;color:var(--stone)}

  .dl{font-weight:700;font-size:3.4cqh;letter-spacing:-.01em}
  .dk{font-weight:700;font-size:2.6cqh;letter-spacing:.04em;color:var(--pink2)}
  .hero2{font-weight:900;letter-spacing:-.05em;line-height:.9;color:var(--pink2)}
  /* dot field: everyone who applied, the selected as glossy pink spheres */
  .fld{display:grid;grid-template-columns:repeat(50,1.6cqh);gap:.5cqh}
  .fld i{width:1.6cqh;height:1.6cqh;border-radius:50%;background:var(--dotc)}

  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  /* how it works: four stations, each with a drawn pictogram */
  .flow{display:flex;align-items:flex-start;gap:0}

  .doc{width:17cqh;height:22cqh;background:#fff;border-radius:1.6cqh;box-shadow:0 1.6cqh 3.4cqh rgba(60,40,30,.12);padding:2.6cqh 2.2cqh;display:flex;flex-direction:column;gap:1.3cqh;position:relative}

  .day .ev b{font-weight:800;font-size:4.8cqh;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .day .ev strong{font-weight:750;font-size:3.5cqh;letter-spacing:-.02em}
  .day .ev span{font-weight:500;font-size:2.8cqh;color:var(--stone)}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,4,3,.9) 0%,rgba(10,4,3,.62) 42%,rgba(10,4,3,.08) 78%)}
  .d.dark .dl em{color:var(--pinkd)}
  body.deck main{background:var(--ivory)}
  /* drawn visuals for the generic deck: cover mark, wildcard card, vote card, shark tank pictograms, submit card, build grid */
  .d .art{position:absolute;right:7cqw;top:50%;transform:translateY(-50%);width:60cqh;height:60cqh;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#FBE1D4 0%,#F6CDB9 40%,rgba(246,205,185,0) 71%)}
  .d .art img{width:58%;filter:drop-shadow(0 2.4cqh 3cqh rgba(185,90,60,.25))}
  .d .wildc{position:absolute;right:7cqw;top:20cqh;width:34cqw;padding:4.4cqh 2.6cqw;border-radius:2.4cqh;background:#fff;box-shadow:inset 0 0 0 .6cqh var(--pink2),0 2.4cqh 5cqh rgba(60,40,30,.1);transform:rotate(2.5deg);display:flex;flex-direction:column;gap:2.4cqh}
  .d .wildc span{font-weight:900;font-size:3.4cqh;letter-spacing:.06em;color:var(--pink2)}
  .d .wildc b{font-weight:820;font-size:5.4cqh;line-height:1.25;letter-spacing:-.03em}
  .d .vcard{position:absolute;right:5cqw;top:13cqh;width:40cqw;padding:4cqh 2.6cqw;border-radius:2.4cqh;background:#fff;box-shadow:0 2.4cqh 5cqh rgba(60,40,30,.1);display:flex;flex-direction:column;gap:2.6cqh}
  .d .vcard .vq{font-weight:820;font-size:4.6cqh;line-height:1.3;letter-spacing:-.03em}
  .d .vcard .vb{display:flex;gap:1cqw} .d .vcard .vb span{flex:1;padding:2.2cqh 1cqw;border-radius:1.4cqh;text-align:center;font-weight:850;font-size:2.8cqh;color:#fff}

  .d .vcard .vt{padding:2cqh 1.4cqw;border-radius:1.4cqh;border:2px solid rgba(23,17,15,.1);font-weight:600;font-size:2.7cqh;line-height:1.45}
  .d .vcard .vt i{display:block;font-style:normal;font-weight:800;font-size:2cqh;color:var(--stone);margin-bottom:.6cqh}
  .d .vcard .vd{display:flex;align-items:center;gap:.8cqw} .d .vcard .vd i{width:3cqh;height:3cqh;border-radius:50%;background:var(--dotc)} .d .vcard .vd i.p{background:#1F9D55}

  .flow .seats{flex:none;display:grid;grid-template-columns:repeat(4,6.2cqh);grid-template-rows:none;gap:1.6cqh}

  .more{font-size:2cqh;color:var(--muted);padding-left:.4cqw}
  .chips.dense{gap:.45cqh .35cqw} .chips.dense i{font-size:1.55cqh;padding:.35cqh .5cqw}
  .seats{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:.9cqh .7cqw}
  .seat{position:relative;display:flex;flex-direction:column;justify-content:center;gap:.3cqh;padding:.8cqh 1cqw;border-radius:1.1cqh;border:1px dashed rgba(246,230,218,.14);min-width:0}
  .seat .rv{font-style:normal;font-weight:900;color:#FFD27A}
  .seat .smv{position:absolute;top:1cqh;right:.9cqw;display:flex} .seat .smv .mv{max-width:5cqw;object-fit:contain;opacity:.85} .seat .smv .mvw{font-size:1.2cqh;font-weight:900;letter-spacing:.08em;color:#FFB08E}
  .seat .n{font-size:1.6cqh;font-weight:800;letter-spacing:.06em;color:var(--faint)} .seat .e{font-size:2.2cqh;font-weight:900;color:rgba(246,230,218,.12)}
  .seat.on{border:none;background:linear-gradient(160deg,rgba(255,122,77,.3),rgba(255,122,77,.08));box-shadow:inset 0 0 0 2px #FF7A4D,0 0 3cqh rgba(255,122,77,.25)}
  .seat.on .n{color:#FFB08E} .seat b{font-size:2.5cqh;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .seat .s{font-size:1.7cqh;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .moved{animation:moved 1.6s ease}
  @keyframes moved{0%{transform:translateX(-3cqw);opacity:0}40%{opacity:1;box-shadow:0 0 0 .4cqh #FF7A4D}100%{transform:none}}
</style>
</head>
<body>
<div id="stage">
<header class="hdr">
  <div class="brand"><span class="title" id="brandTitle"></span><span class="sub" id="brandSub"></span></div>
  <div class="tag" id="tag"></div>
  <div class="right"><span class="clock num" id="clock"></span><img class="mascot" id="mascot" alt=""></div>
</header>
<main id="main">
  <section class="scene" id="standby"></section>
  <section class="scene" id="board"></section>
  <section class="scene" id="topics"></section>
  <section class="scene" id="commits"></section>
  <section class="scene" id="missions"></section>
  <section class="scene center" id="break"></section>
  <section class="scene" id="demo"></section>
  <section class="scene" id="match"></section>
  <section class="scene center" id="announce"></section>
  <section class="scene center" id="closing"></section>
  <section class="scene" id="slide"></section>
  <div class="ticker" id="ticker" style="display:none"><div class="lbl">LIVE COMMITS</div><div class="tw"><div class="track" id="track"></div></div></div>
</main>
<footer id="logos"></footer>
<div class="flash" id="flash"></div>
<div class="subban" id="subBanner"></div>
</div>

<script type="module">
import { api, poll, serverNow, hm, hms, dur, ago, esc, VCS, HOSTS, EVENT, NAME, missionTitle, $ } from '/assets/common.js';
import { SLIDES, stepSlide } from '/assets/slides.js';

const params = new URLSearchParams(location.search);
const KEY = params.get('key'); // with ?key=ADMIN the LED also accepts keyboard / clicker input
let S = null, lastScene = null, shownFlash = null, prevPass = new Set(), lastRender = '';
let pending = {}, pendingUntil = 0;
const PREVIEW = (params.get('preview') || '').split(':');
const EMBED = window.self !== window.top; // the console's small preview stays silent
let lastNewSubAt = 0; // set by checkNewSubs
const ledState = () => {
  const srv = PREVIEW[0] ? { ...(S?.led || {}), scene: PREVIEW[0], slide: Number(PREVIEW[1] || 0), topicsShown: 99, flash: null } : (S?.led || {});
  // keep local clicker presses until the server has caught up with every pressed value (max 10s)
  if (Object.keys(pending).length && Object.entries(pending).every(([k, v]) => JSON.stringify(srv[k]) === JSON.stringify(v))) pending = {};
  const out = { ...srv, ...(Date.now() < pendingUntil ? pending : {}) };
  // the old separate mission scene now shows the opening's mission slide, so there is only one look
  if (out.scene === 'topics') return { ...out, scene: 'slide', slide: MISSION_I };
  // the live board and the commit activity take turns on their own (40s / 25s), the same on every screen
  // from 30 minutes before the submit deadline the board stays put
  const finalStretch = serverNow() >= new Date(S?.config?.submitDeadline || EVENT.times.submitDeadline).getTime() - 30 * 60000;
  const freshReveal = out.flash && serverNow() - (out.flash.at || 0) < 35000;
  const freshSub = Date.now() - lastNewSubAt < 30000;
  if (out.scene === 'board' && out.autoRotate !== false && !PREVIEW[0] && !freshReveal && !freshSub && !finalStretch) {
    // seconds for board / commits / missions: the board gets more time while teams are being judged;
    // config.rotate (set from the admin API) overrides it without reloading the screen
    const busy = (S?.subs || []).some(x => x.status === 'queued' || x.status === 'reviewing');
    const R = Array.isArray(S?.config?.rotate) && S.config.rotate.length === 3 ? S.config.rotate : busy ? [35, 15, 15] : [20, 25, 25];
    const t = serverNow() % ((R[0] + R[1] + R[2]) * 1000);
    if (t >= (R[0] + R[1]) * 1000) return { ...out, scene: 'missions' };
    if (t >= R[0] * 1000) return { ...out, scene: 'commits' };
  }
  return out;
};
const MISSION_I = SLIDES.findIndex(x => x.topics);

// the event's name, date and mark in the header; the logo band of partners and VCs at the bottom
document.title = `${EVENT.short} LED`;
$('#brandTitle').innerHTML = `${esc(NAME[0])}${NAME[1] ? ` <b>${esc(NAME[1])}</b>` : ''}`;
$('#brandSub').textContent = `${EVENT.dateLabel} · ${EVENT.venue}`;
if (EVENT.mark) { $('#mascot').src = EVENT.mark; $('#mascot').onerror = () => $('#mascot').remove(); } else $('#mascot').remove();
const CH = EVENT.discord?.participants, P = EVENT.prize, TRAILER = EVENT.media?.trailer, POSTER = EVENT.media?.poster;
const logo = (l, base) => `<img src="${l.color || l.logo}" alt="${esc(l.name)}" style="height:calc(min(${base}cqh, ${(base*0.5).toFixed(2)}cqw) * ${l.h})">`;
$('#logos').innerHTML = `<div class="grp">${HOSTS.map(h => logo(h, 4.4)).join('')}</div><div class="grp vcs">${VCS.map(v => logo(v, 3.5)).join('')}</div>`;

const TAGS = { standby: 'WELCOME', board: '<span class="dot"></span>LIVE · 본선 진출 현황', topics: 'MISSION', commits: '<span class="dot"></span>LIVE · 개발 현황', missions: '<span class="dot"></span>LIVE · 미션별 도전 현황', break: 'BREAK', demo: 'SHARK TANK', match: 'MATCHING', announce: 'NOTICE', closing: 'THANK YOU', slide: '' };

function show(scene) {
  if (scene !== 'standby') { const v = document.getElementById('trailer'); if (v) v.pause(); }
  document.querySelectorAll('.scene').forEach(el => el.classList.toggle('on', el.id === scene));
  document.body.classList.toggle('deck', scene === 'slide');
  if (scene !== 'demo') document.body.classList.remove('stagefull');
  document.body.classList.toggle('arena', scene !== 'slide');
  $('#tag').innerHTML = TAGS[scene] ?? '';
  lastScene = scene;
}

const teamName = id => S.teams.find(t => t.id === id)?.name || id;
const team = id => S.teams.find(t => t.id === id) || {};
const missionOf = id => { const tp = (S.config.topics || []).find(o => o.id === team(id).topic?.topic); return tp ? { vc: VCS.find(v => v.key === tp.vc) || null, title: tp.vc ? tp.title : `와일드카드 · ${tp.short || tp.title}` } : null; };
const vcMark = (id, base) => { const m = missionOf(id); return m?.vc ? `<img class="mv" src="${m.vc.logo}" style="height:${(base * m.vc.h).toFixed(2)}cqh" alt="${esc(m.vc.name)}">` : m ? `<span class="mvw">WILD</span>` : ''; };
const sub = id => S.subs.find(x => x.teamId === id);

let sbMode = 'info', sbInfoSince = 0;
// standby: a title card with the event mark; a poster image and a trailer join in only when assets/event.js names them
function renderStandby(led) {
  const el = $('#standby');
  if (!el.dataset.built) {
    el.dataset.built = '1';
    const art = `<div class="sb-art"><div class="rays"></div>${EVENT.mark ? `<img src="${esc(EVENT.mark)}" onerror="this.remove()" alt="">` : ''}</div>`;
    el.innerHTML = `
      ${TRAILER ? `<div class="vid hide"><video id="trailer" src="${esc(TRAILER)}" playsinline muted preload="auto"></video></div>` : ''}
      <div class="info">
        ${POSTER ? `<img class="poster" src="${esc(POSTER)}" alt="">` : art}
        <div class="sb-col">
          <div class="kicker">ONE DAY HACKATHON · ${esc(EVENT.dateLabel)} · ${esc(EVENT.venue)}</div>
          <div class="sb-title">${esc(NAME[0])}${NAME[1] ? `<br>${esc(NAME[1])}` : ''}</div>
          <div class="sb-sub">${esc(EVENT.tagline || '')}</div>
          <div class="sb-meta">
            <div id="sb-cd" class="num"></div>
            <div class="sb-row"><div>행사장 Wi-Fi<b id="sb-wifi"></b></div></div>
          </div>
        </div>
      </div>`;
    // a poster that fails to load gives way to the title card art
    el.querySelector('.poster')?.addEventListener('error', e => e.target.replaceWith(Object.assign(document.createElement('div'), { innerHTML: art }).firstChild));
    if (TRAILER) {
      const v = $('#trailer');
      const toInfo = () => { sbMode = 'info'; sbInfoSince = Date.now(); el.querySelector('.vid').classList.add('hide'); el.querySelector('.info').classList.remove('hide'); };
      v.addEventListener('ended', toInfo);
      // never leave a black frame on the LED: if the trailer stops or fails, fall back to the title card
      v.addEventListener('error', () => { toInfo(); sbMode = 'off'; });
      v.addEventListener('pause', () => setTimeout(() => { if (sbMode === 'video' && v.paused && !v.ended) toInfo(); }, 1500));
      sbInfoSince = Date.now() - 15000; // first trailer starts ~10s after the screen opens
    }
  }
  const v = $('#trailer');
  if (v) {
    v.muted = EMBED || led.standbySound === false; // trailer sound on unless turned off in the console; never in the console preview
    if (sbMode === 'info' && Date.now() - sbInfoSince > (led.standbyInfoSec || 25) * 1000) {
      sbMode = 'video';
      el.querySelector('.info').classList.add('hide'); el.querySelector('.vid').classList.remove('hide');
      v.currentTime = 0; v.play().catch(() => { v.muted = true; return v.play(); }).catch(() => { sbMode = 'info'; sbInfoSince = Date.now(); el.querySelector('.vid').classList.add('hide'); el.querySelector('.info').classList.remove('hide'); });
    }
  }
  const left = new Date(led.standbyTarget || EVENT.times.standby).getTime() - serverNow();
  $('#sb-cd').innerHTML = left > 0 && left < 864e5 ? `시작까지 <b>${dur(left)}</b>` : ''; // more than a day away: the date in the kicker says enough
  $('#sb-wifi').textContent = led.wifi || EVENT.wifi || '';
}

// live board: every team moves left to right, 제출 전 → 심사 중 → 본선 / 탈락
let prevCol = {};
function renderBoard() {
  const cap = S.config.capacity, th = S.config.threshold;
  const left = new Date(S.config.submitDeadline).getTime() - serverNow();
  const before = new Date(S.config.submitOpenAt).getTime() - serverNow();
  const subOf = Object.fromEntries(S.subs.map(x => [x.teamId, x]));
  const colOf = id => { const x = subOf[id]; return !x ? 'wait' : x.status === 'pass' ? 'pass' : (x.status === 'fail' || x.status === 'closed') ? 'out' : 'review'; };
  const now = Object.fromEntries(S.teams.map(t => [t.id, colOf(t.id)]));
  const moved = id => prevCol[id] && prevCol[id] !== now[id] ? ' moved' : '';
  const waiting = S.teams.filter(t => now[t.id] === 'wait');
  const review = S.subs.filter(x => now[x.teamId] === 'review').sort((a, b) => a.no - b.no);
  const out = S.subs.filter(x => now[x.teamId] === 'out').sort((a, b) => a.no - b.no);
  const no = x => '#' + String(x.no).padStart(2, '0');
  const seats = Array.from({ length: cap }, (_, i) => {
    const id = S.passList[i];
    if (!id) return `<div class="seat"><span class="n">FINALIST ${String(i + 1).padStart(2, '0')}</span><span class="e">OPEN</span></div>`;
    const x = subOf[id] || {};
    return `<div class="seat on${moved(id)}"><span class="n">FINALIST ${String(i + 1).padStart(2, '0')}</span><b>${esc(teamName(id))}</b><span class="s">${x.result?.revived ? '<em class="rv">패자부활</em> ' : ''}${esc(x.serviceName || '')}</span><span class="smv">${vcMark(id, 1.3)}</span></div>`;
  }).join('');
  const clock = S.full ? `<div class="kicker">본선 ${cap}팀 확정</div><div class="cdl">샤크탱크${EVENT.times?.sharkTank ? ' ' + hm(EVENT.times.sharkTank) : ''}</div>`
    : before > 0 ? `<div class="kicker">제출은 ${hm(S.config.submitOpenAt)}부터</div><div class="cdl">주제 선언 ${hm(S.config.topicDeadline)}까지</div>`
    : left > 0 ? `<div class="kicker">제출 마감 ${hm(S.config.submitDeadline)}까지 · 선착순</div><div class="cd num ${left < 600000 ? 'crit' : left < 3600000 ? 'hot' : ''}${left < 1800000 ? ' final' : ''}">${dur(left)}</div>`
    : `<div class="kicker">제출 마감</div><div class="cdl">남은 심사를 진행하고 있어요</div>`;
  const MAXR = 9; // what fits in a column at any window size
  const html = `
    <div class="btop"><div class="clk">${clock}</div><div class="rule2">VC ${th}곳이 PASS하면 본선, ${th}곳이 FAIL하면 탈락 · 본선 ${cap}자리가 차면 마감${CH ? `<br>문의는 디스코드 ${esc(CH)}` : ''}</div></div>
    <div class="pipe">
      <div class="col"><div class="ch"><b>제출 전</b><span class="num">${waiting.length}</span></div>
        <div class="chips${waiting.length > 30 ? ' dense' : ''}">${waiting.map(t => `<i class="${moved(t.id)}">${esc(t.name)}</i>`).join('')}</div></div>
      <div class="arr">→</div>
      <div class="col"><div class="ch"><b>심사 중 <i class="vlg"><i class="g"></i>PASS<i class="r"></i>FAIL</i></b><span class="num">${review.length}</span></div>
        <div class="cards">${review.slice(0, MAXR).map(x => `<div class="cd2${x.ready ? ' ready' : ''}${moved(x.teamId)}"><span class="no num">${no(x)}</span><span class="nm">${esc(teamName(x.teamId))}</span>${x.ready ? '<span class="rdy">곧 결과 공개</span>' : `<span class="vd">${Array.from({ length: S.vcs.length }, (_, k) => `<i class="${k < (x.pass || 0) ? 'p' : k < (x.pass || 0) + (x.fail || 0) ? 'f' : ''}"></i>`).join('')}</span>`}</div>`).join('')}${review.length > MAXR ? `<div class="more">외 ${review.length - MAXR}팀</div>` : ''}</div></div>
      <div class="arr">→</div>
      <div class="col wide"><div class="ch"><b>본선${P ? ` <i class="prize">${esc(P.label)} ${esc(P.amount)}</i>` : ''}</b><span class="num">${S.passList.length} / ${cap}</span></div><div class="seats">${seats}</div></div>
      <div class="col narrow"><div class="ch"><b>탈락</b><span class="num">${out.length}</span></div>
        <div class="cards">${out.slice(-MAXR).map(x => `<div class="cd2 dim${moved(x.teamId)}"><span class="no num">${no(x)}</span><span class="nm">${esc(teamName(x.teamId))}</span></div>`).join('')}${out.length > MAXR ? `<div class="more">외 ${out.length - MAXR}팀</div>` : ''}</div></div>
    </div>`;
  if ($('#board').dataset.h !== html) { $('#board').dataset.h = html; $('#board').innerHTML = html; }
  prevCol = now;
}

function renderTopics(led, target = $('#topics')) {
  const shown = led.topicsShown ?? 99;
  const topics = S.config.topics || [];
  const key = 'topics:' + shown + ':' + topics.length;
  if (target.dataset.i === key) return;
  target.dataset.i = key;
  target.innerHTML = `<div class="topics${topics.length > 9 ? ' wide' : ''}">${topics.map((t, i) => {
    const vc = VCS.find(v => v.key === t.vc);
    const hidden = i >= shown;
    const flip = !hidden && i === shown - 1 ? 'flip' : '';
    if (t.id === 'wild') return `<div class="tc wild ${hidden ? 'hidden' : flip}"><div class="lw"><div class="wl">WILDCARD</div></div><div class="t">${esc(missionTitle(t))}</div></div>`;
    return `<div class="tc ${hidden ? 'hidden' : flip}"><div class="lw">${vc ? `<img class="logo" src="${document.body.classList.contains('arena') ? vc.logo : (vc.color || vc.logo)}" style="height:${(3.3 * vc.h).toFixed(2)}cqh" alt="">` : ''}</div><div class="t">${esc(t.title)}</div></div>`;
  }).join('')}</div>`;
}

function renderCommits() {
  const withC = S.teams.filter(t => t.commits);
  const total = withC.reduce((a, t) => a + (t.commits.count || 0), 0);
  const now = serverNow();
  const live = withC.filter(t => now - (t.commits.lastAt || 0) < 15 * 60000).length;
  const rows = withC.slice().sort((a, b) => (b.commits.count || 0) - (a.commits.count || 0)).slice(0, 12);
  const max = Math.max(1, ...rows.map(t => t.commits.count || 0));
  const key = total + ':' + live + ':' + (S.feed[0]?.at || 0);
  if ($('#commits').dataset.k === key + ':' + Math.floor(now / 30000)) return;
  $('#commits').dataset.k = key + ':' + Math.floor(now / 30000);
  $('#commits').innerHTML = `
    <div class="cmwrap">
      <div class="cmstats">
        <div><span class="n num">${total.toLocaleString('ko-KR')}</span><span class="l">오늘 올라온 커밋</span></div>
        <div><span class="n num">${live}</span><span class="l">지금 개발 중인 팀 <i>(15분 안에 커밋)</i></span></div>
        <div><span class="n num">${withC.length}</span><span class="l">커밋을 시작한 팀 / ${S.teams.length}</span></div>
      </div>
      <div class="cmcols">
        <div class="cmleft"><div class="kicker">팀별 커밋 TOP 12 · 모든 레포는 공개</div>
          ${rows.map(t => { const hot = now - (t.commits.lastAt || 0) < 5 * 60000; return `<div class="cmrow${hot ? ' hot' : ''}"><b>${esc(t.name)}</b><div class="cbar"><div class="bar" style="width:${(100 * (t.commits.count || 0) / max).toFixed(0)}%"></div></div><span class="num">${t.commits.count}${t.commits.countPlus ? '+' : ''}</span></div>`; }).join('') || '<div class="muted">아직 커밋이 없어요</div>'}
        </div>
        <div class="cmright"><div class="kicker">방금 올라온 커밋</div>
          <div class="feed">${S.feed.slice(0, 9).map(f => `<div><b>${esc(f.team)}</b> <span class="muted">· ${ago(f.at)}</span><br>${esc(String(f.msg).split('\n')[0].slice(0, 90))}</div>`).join('')}</div>
        </div>
      </div>
    </div>`;
}

// which mission each team took, busiest first
function renderMissions() {
  const topics = S.config.topics || [];
  const by = Object.fromEntries(topics.map(t => [t.id, []]));
  // status per team: 본선 > 심사 중 > 개발 중 > 탈락 (results only once announced)
  const st = {}; S.subs.forEach(x => { st[x.teamId] = x.status === 'pass' ? 'p' : (x.status === 'fail' || x.status === 'closed') ? 'o' : 'r'; });
  const rank = { p: 0, r: 1, d: 2, o: 3 };
  S.teams.forEach(t => { const k = t.topic?.topic; if (k && by[k]) by[k].push({ n: t.name, s: st[t.id] || 'd' }); });
  Object.values(by).forEach(a => a.sort((x, y) => rank[x.s] - rank[y.s]));
  const declared = S.teams.filter(t => t.topic).length;
  // missions nobody picked stay off the big screen (no partner sees a public zero)
  const rows = topics.map((t, i) => ({ t, i, names: by[t.id] })).filter(r => r.names.length).sort((a, b) => b.names.length - a.names.length || a.i - b.i);
  const key = declared + '|' + rows.map(r => r.t.id + ':' + r.names.map(x => x.n + x.s).join(',')).join('|');
  if ($('#missions').dataset.k === key) return;
  $('#missions').dataset.k = key;
  $('#missions').innerHTML = `<div class="mswrap">
    <div class="cmstats ms"><div><span class="n num">${declared}</span><span class="l">주제를 선언한 팀 / ${S.teams.length}</span></div>
      <div><span class="n num">${rows.length}</span><span class="l">팀이 도전 중인 미션</span></div>
      <div class="mslegend"><i class="s-p">본선</i><i class="s-r">심사 중</i><i class="s-d">개발 중</i><i class="s-o">탈락</i></div></div>
    <div class="msrows">${rows.map(({ t, names }) => {
      const vc = VCS.find(v => v.key === t.vc);
      const title = missionTitle(t);
      return `<div class="msrow${names.length ? '' : ' none'}"><span class="mn num">${names.length}</span>
        <div class="mlogo">${vc ? `<img src="${vc.logo}" style="height:${(2.5 * vc.h).toFixed(2)}cqh" alt="">` : '<span class="wl">WILDCARD</span>'}</div>
        <b class="mt">${esc(title)}</b><span class="mteams">${names.map(x => `<i class="s-${x.s}">${esc(x.n)}</i>`).join('')}</span></div>`;
    }).join('')}</div></div>`;
}

// the optional QR box (assets/event.js qr.break) only shows when an image is set
const qrBox = (q, style = '') => q?.img ? `<div class="qrbox"${style ? ` style="${style}"` : ''}><img src="${esc(q.img)}" onerror="this.parentNode.remove()" alt=""><div class="p" style="text-align:left;white-space:pre-line">${esc(q.text || '')}</div></div>` : '';
function renderBreak(led) {
  const until = new Date(led.breakUntil || EVENT.times.sharkTank).getTime() - serverNow();
  $('#break').innerHTML = `
    <div class="kicker">${esc(led.breakTitle || 'SHARK TANK PREP')}</div>
    <div class="h1" style="margin:2cqh 0">${esc(led.breakText || '샤크탱크를 준비해 주세요')}</div>

  addEventListener('keydown', e => {
    if (!S) return;
    const led = ledState();
    const fwd = ['ArrowRight', 'PageDown', ' ', 'ArrowDown'].includes(e.key), back = ['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.key);
    if (/^[0-9]$/.test(e.key)) setLed({ scene: scenes[(Number(e.key) + 9) % 10] });
    else if (fwd || back) {
      const d = fwd ? 1 : -1;
      if (led.scene === 'standby' && fwd) setLed({ scene: 'slide', slide: 0 });
      else if (led.scene === 'slide') {
        const patch = stepSlide(led, d, S.config.topics.length);
        setLed(patch);
        // reaching the mission slide opens topic declaration on the participant page
        if (SLIDES[patch.slide ?? led.slide]?.topics && !S.config.topicsRevealed) api('/api/admin', { method: 'POST', key: KEY, body: { action: 'setConfig', patch: { topicsRevealed: true } } }).catch(() => {});
      }
      else if (led.scene === 'topics') setLed({ topicsShown: Math.max(0, Math.min((led.topicsShown ?? 0) + d, S.config.topics.length)) });
      else if (led.scene === 'match') setLed({ matchShown: Math.max(0, (led.matchShown ?? 0) + d) });
      else if (led.scene === 'demo') {
        const demo = led.demo || {}, idx = demo.idx || 0;
        const cur = stageLocal && Date.now() < stageLocal.until && stageLocal.idx === idx ? stageLocal : { view: demo.view || 'intro', page: demo.page || 0 };
        if (cur.view === 'demo') return; // arrows belong to the demo itself
        const page = cur.view === 'intro' ? 0 : Math.max(0, Math.min(cur.page + d, Math.max(stageN, 1) - 1));
        stageLocal = { idx, view: 'slides', page, until: Date.now() + 4000 };
        render();
        api('/api/admin', { method: 'POST', key: KEY, body: { action: 'demo', op: 'view', view: 'slides', page } }).catch(e => console.warn(e));
      }
    } else if (e.key === 'f') document.documentElement.requestFullscreen?.();
    else if (e.key === 'Escape' && led.flash) setLed({ flash: null });
  });
}

// view-only slide browsing (/slides or ?preview=slide:N): arrows, clicker or a click step locally, nothing is written
if (PREVIEW[0] === 'slide') {
  const go = d => { PREVIEW[1] = String(Math.max(0, Math.min(Number(PREVIEW[1] || 0) + d, SLIDES.length - 1))); history.replaceState(null, '', `?preview=slide:${PREVIEW[1]}`); render(); };
  addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' ', 'ArrowDown', 'Enter'].includes(e.key)) go(1);
    else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(e.key)) go(-1);
    else if (e.key === 'f') document.documentElement.requestFullscreen?.();
  });
  addEventListener('click', () => go(1));
}
</script>
